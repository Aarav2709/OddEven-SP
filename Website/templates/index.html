<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddEvenSP</title>
    <meta name="description" content="A beautiful black and white minimalist cricket game. Challenge the AI in odd-even cricket!">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="nav-container">
        <a href="/" class="logo">OddEvenSP</a>
        <ul class="nav-links">
            <li><a href="/" class="nav-link active">Home</a></li>
            <li><a href="/game" class="nav-link">Play</a></li>
            <li><a href="/stats" class="nav-link">Stats</a></li>
            <li><a href="/progress" class="nav-link">Progress</a></li>
            <li><a href="/achievements" class="nav-link">Achievements</a></li>
        </ul>
    </nav>

    <main>
        <section class="section">
            <div class="container text-center">
                <h1 class="display-text fade-in">
                    OddEven<span style="font-weight: 300; opacity: 0.5;">SP</span>
                </h1>

                <p class="heading-lg fade-in" style="font-weight: 300; animation-delay: 0.1s;">
                    Minimalist Cricket. Pure Strategy.
                </p>

                <div class="fade-in" style="animation-delay: 0.2s; margin-top: var(--space-lg);">
                    <a href="/game" class="btn btn-primary">Start Playing</a>
                    <a href="/stats" class="btn" style="margin-left: 1rem;">View Stats</a>
                </div>

                <div class="fade-in" style="animation-delay: 0.3s; margin-top: var(--space-xl); opacity: 0.4;">
                    <p class="text-mono" style="font-size: 0.8rem;">© 2025 OddEvenSP</p>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
