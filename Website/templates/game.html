<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddEvenSP - Game</title>
    <meta name="description" content="Play the minimalist cricket game against AI opponents">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="nav-container">
        <a href="/" class="logo">OddEvenSP</a>
        <ul class="nav-links">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/game" class="nav-link active">Play</a></li>
            <li><a href="/stats" class="nav-link">Stats</a></li>
            <li><a href="/progress" class="nav-link">Progress</a></li>
            <li><a href="/achievements" class="nav-link">Achievements</a></li>
        </ul>
    </nav>

    <main class="game-wrapper">

        <!-- Toss Interface -->
        <div id="toss-interface" class="game-card fade-in" style="display: none;">
            <div class="text-center mb-4">
                <h1 class="heading-lg">Coin Toss</h1>
                <p class="text-secondary">Heads or Tails?</p>
            </div>

            <div class="coin-stage">
                <div id="coin" class="coin">
                    <div class="coin-face heads">H</div>
                    <div class="coin-face tails">T</div>
                </div>
            </div>

            <div class="text-center mt-4">
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button id="call-heads" class="btn">Heads</button>
                    <button id="call-tails" class="btn">Tails</button>
                </div>
            </div>
        </div>

        <!-- Toss Result -->
        <div id="toss-result" class="game-card fade-in" style="display: none;">
            <div class="text-center mb-4">
                <h1 class="heading-lg">Result</h1>
                <p id="toss-outcome" class="text-mono mb-4"></p>
                <div id="toss-winner-message" class="mb-4"></div>
            </div>

            <div id="choice-selection" class="text-center" style="display: none;">
                <p class="mb-4">Choose your strategy:</p>
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button id="choose-bat" class="btn">Bat First</button>
                    <button id="choose-bowl" class="btn">Bowl First</button>
                </div>
            </div>

            <div id="bot-choice" class="text-center" style="display: none;">
                <p class="mb-4">Bot chose to <span id="bot-decision" class="text-mono"></span></p>
                <button id="proceed-after-toss" class="btn btn-primary">Start Match</button>
            </div>
        </div>

        <!-- Game Setup -->
        <div id="game-setup" class="game-card fade-in">
            <div class="text-center">
                <h1 class="heading-lg">New Game</h1>
                <p class="text-secondary mb-4">Ready to challenge the AI?</p>

                <div class="mb-4">
                    <label class="text-mono" style="display: block; margin-bottom: 0.5rem;">DIFFICULTY</label>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <label style="cursor: pointer;">
                            <input type="radio" name="difficulty" value="easy"> Easy
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="difficulty" value="medium" checked> Medium
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="difficulty" value="hard"> Hard
                        </label>
                    </div>
                </div>

                <button id="start-toss" class="btn btn-primary">Start Game</button>
                <!-- Hidden start game button for direct start if needed -->
                <button id="start-game" class="btn hidden">Quick Start</button>
            </div>
        </div>

        <!-- Main Game Interface -->
        <div id="game-interface" class="game-card fade-in" style="display: none;">

            <div class="score-board">
                <div class="score-item">
                    <span id="player-score" class="score-val">0</span>
                    <div class="score-label">Player</div>
                </div>
                <div class="score-item">
                    <span id="target-score" class="score-val">-</span>
                    <div class="score-label">Target</div>
                </div>
                <div class="score-item">
                    <span id="bot-score" class="score-val">0</span>
                    <div class="score-label">Bot</div>
                </div>
            </div>

            <div class="text-center mb-4">
                <div id="game-status-text" class="text-mono" style="font-size: 1.1rem;">
                    <span id="current-innings">1st Innings</span> • <span id="batting-status">Batting</span>
                </div>
                <div id="commentary" class="text-secondary mt-4" style="min-height: 1.5em;"></div>
            </div>

            <div class="input-grid">
                <button class="num-btn" data-number="1">1</button>
                <button class="num-btn" data-number="2">2</button>
                <button class="num-btn" data-number="3">3</button>
                <button class="num-btn" data-number="4">4</button>
                <button class="num-btn" data-number="5">5</button>
                <button class="num-btn" data-number="6">6</button>
                <button class="num-btn" data-number="7">7</button>
                <button class="num-btn" data-number="8">8</button>
                <button class="num-btn" data-number="9">9</button>
                <button class="num-btn" data-number="10">0</button>
            </div>

            <div class="text-center mt-4">
                <button id="play-turn" class="btn btn-primary" disabled>Play Move</button>
            </div>

            <div class="history-log" id="move-history">
                <!-- History items will be added here -->
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over" class="game-card fade-in" style="display: none;">
            <div class="text-center">
                <h1 class="heading-lg" id="game-result-title">Game Over</h1>
                <p id="game-result-message" class="text-secondary mb-4"></p>

                <div class="score-board" style="justify-content: center; gap: 3rem;">
                    <div class="score-item">
                        <span id="final-player-score" class="score-val">0</span>
                        <div class="score-label">You</div>
                    </div>
                    <div class="score-item">
                        <span id="final-bot-score" class="score-val">0</span>
                        <div class="score-label">Bot</div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                    <button onclick="location.reload()" class="btn btn-primary">Play Again</button>
                    <a href="/stats" class="btn">View Stats</a>
                </div>
            </div>
        </div>

    </main>

    <!-- Hidden inputs for game state -->
    <input type="hidden" name="mode" value="bat">

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
