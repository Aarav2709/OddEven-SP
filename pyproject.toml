[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OddEven-SP"
version = "4.0.1"
authors = [
    { name = "Aarav Gupta", email = "tribejustice35@gmail.com" }
]
description = "A cricket based Odd Even single player terminal game."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

keywords = [
    "oddeven",
    "cricket",
    "game",
    "terminal",
    "python"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = [
    "colorama>=0.4.6"
]

[project.urls]
Homepage = "https://github.com/Aarav2709/OddEven-SP"

[project.scripts]
oddeven-sp = "oddeven_sp:main"

[tool.setuptools.packages.find]
where = ["."]
